name: Check Docker image
on:
  push:
    branches: [main]
    paths: ['dist/**', 'deploy/**', 'Dockerfile', 'compose.yaml', '.github/workflows/docker.yml']
  pull_request:
    paths: ['dist/**', 'deploy/**', 'Dockerfile', 'compose.yaml', '.github/workflows/docker.yml']
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 90
      - name: Check web server
        run: |
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/ | grep -q '拾图'
          curl --fail http://localhost:8080/app.js -o /dev/null
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down
